name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build universal zip
        run: |
          make zip VERSION=0.0.0 ARCHS="arm64 x86_64"
          packaging/check-app.sh build/Sightglass.app 0.0.0
